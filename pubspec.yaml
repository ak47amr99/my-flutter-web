name: petgacha
description: A Flutter app for rolling cat cards.
publish_to: 'none' # This tells pub not to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: '>=2.17.0 <3.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  firebase_core: ^3.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter


